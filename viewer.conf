# Viewer settings. Environment variables (MD_ROOT, MD_TITLE, PORT, VIEWER_HOST)
# override these values; these apply when no env var is set.
# host = bind interface: 0.0.0.0 = whole network, 127.0.0.1 = only this machine.
[viewer]
title = Document Viewer
root = toview
port = 5000
# host = 127.0.0.1
